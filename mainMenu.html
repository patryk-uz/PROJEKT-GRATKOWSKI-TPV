<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>React Menu Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  //LADNIEJSZY CSS POZNIEJ TERAZ TYLKO TAK STARTOWO
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Prawy górny róg - lista graczy w lobby */
    .lobby-widget {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .lobby-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 2px;
      font-weight: bold;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Okrągły awatar w stylu profilu */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .player-row.is-me .avatar {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .player-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .player-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .player-balance {
      font-size: 12px;
      color: #4ade80;
      font-family: monospace;
      font-weight: bold;
    }

    /* Karty gier */
    .grid { display: flex; gap: 16px; margin-top: 20px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 12px;
      width: 120px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .card:hover { 
      border-color: #38bdf8; 
      transform: translateY(-4px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      background: #38bdf8;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const CZERWONE = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

    function Ruletka({ saldo, onUpdateSaldo, onBack }) {
      const [stawka, setStawka] = useState(10);
      const [typZakladu, setTypZakladu] = useState('red');
      const [wybranyNumer, setWybranyNumer] = useState(0);
      const [komunikat, setKomunikat] = useState('');

      const krec = () => {
        const kwota = Number(stawka);

        if (kwota <= 0 || isNaN(kwota)) {
          setKomunikat('Podaj poprawną stawkę!');
          return;
        }
        if (saldo !== null && kwota > saldo) {
          setKomunikat('Nie masz tylu środków!');
          return;
        }

        const wylosowany = Math.floor(Math.random() * 37);
        let kolor = 'zielony';
        if (wylosowany !== 0) {
          kolor = CZERWONE.includes(wylosowany) ? 'czerwony' : 'czarny';
        }

        let wygrana = false;
        let mnoznik = 0;

        if (typZakladu === 'red' && kolor === 'czerwony') {
          wygrana = true;
          mnoznik = 2;
        } else if (typZakladu === 'black' && kolor === 'czarny') {
          wygrana = true;
          mnoznik = 2;
        } else if (typZakladu === 'even' && wylosowany !== 0 && wylosowany % 2 === 0) {
          wygrana = true;
          mnoznik = 2;
        } else if (typZakladu === 'odd' && wylosowany % 2 !== 0) {
          wygrana = true;
          mnoznik = 2;
        } else if (typZakladu === 'number' && wylosowany === Number(wybranyNumer)) {
          wygrana = true;
          mnoznik = 36;
        }

        const aktualneSaldo = saldo === null ? 0 : saldo;

        if (wygrana) {
          const zysk = kwota * (mnoznik - 1);
          onUpdateSaldo(aktualneSaldo + zysk);
          setKomunikat(`Wynik: ${wylosowany} (${kolor}). Wygrałeś ${kwota * mnoznik} PLN! 🎉`);
        } else {
          onUpdateSaldo(aktualneSaldo - kwota);
          setKomunikat(`Wynik: ${wylosowany} (${kolor}). Przegrałeś ${kwota} PLN.`);
        }
      };

      return (
        <div style={{ textAlign: 'center' }}>
          <h1>Grasz teraz w: Ruletka</h1>
          <h2>Twoje saldo: {saldo == null ? "BANKRUT" : saldo} PLN</h2>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', alignItems: 'center', margin: '20px 0' }}>
            <label>
              Stawka:{' '}
              <input
                type="number"
                min="1"
                value={stawka}
                onChange={(e) => setStawka(e.target.value)}
                style={{ padding: '4px' }}
              />
            </label>
            <label>
              Zakład:{' '}
              <select value={typZakladu} onChange={(e) => setTypZakladu(e.target.value)} style={{ padding: '4px' }}>
                <option value="red">Czerwone (2x)</option>
                <option value="black">Czarne (2x)</option>
                <option value="even">Parzyste (2x)</option>
                <option value="odd">Nieparzyste (2x)</option>
                <option value="number">Dokładny numer (36x)</option>
              </select>
            </label>
            {typZakladu === 'number' && (
              <label>
                Numer (0-36):{' '}
                <input
                  type="number"
                  min="0"
                  max="36"
                  value={wybranyNumer}
                  onChange={(e) => setWybranyNumer(e.target.value)}
                  style={{ width: '50px', padding: '4px' }}
                />
              </label>
            )}
            <button onClick={krec}>Zakręć</button>
          </div>
          {komunikat && <p style={{ fontWeight: 'bold' }}>{komunikat}</p>}
          <button onClick={onBack}>← Wróć do menu</button>
        </div>
      );
    }

    // DEKLARACJE ZMIENNYCH 
    function App() {
      const [wybranaGra, setWybranaGra] = useState(null);
      const [mojeSaldo, setMojeSaldo] = useState(null);
      const [saldo2,saldo3,saldo4] = useState(null);

      // TU PRZYPISUJEMY SALDA GRACZY CHYBA ZE LEPIEJ JUZ W TABELI

      // DANE W LOBBY
      const graczeWLobby = [
        { id: 1, nick: "Ty", saldo: mojeSaldo, avatar: "👑", isMe: true },
        { id: 2, nick: "", saldo: saldo2, avatar: "🎩", isMe: false },
        { id: 3, nick: "", saldo: saldo3, avatar: "🕶️", isMe: false },
        { id: 4, nick: "", saldo: saldo4, avatar: "🎮", isMe: false },
      ];

      return (
        <div>
          <div className="lobby-widget">
            <span className="lobby-title">W lobby (4)</span>
            {graczeWLobby.map((gracz) => (
              <div key={gracz.id} className={`player-row ${gracz.isMe ? 'is-me' : ''}`}>
                <div className="avatar">{gracz.avatar}</div>
                <div className="player-info">
                  <span className="player-name">{gracz.nick}</span>
                  <span className="player-balance">
                   {gracz.saldo == null ? "BANKRUT" : gracz.saldo}
                  </span>
                </div>
              </div>
            ))}
          </div>

          {/* STRONA GRY */}
          {wybranaGra === 'Ruletka' ? (
            <Ruletka
              saldo={mojeSaldo}
              onUpdateSaldo={setMojeSaldo}
              onBack={() => setWybranaGra(null)}
            />
          ) : wybranaGra ? (
            <div style={{ textAlign: "center" }}>
              <h1>Grasz teraz w: {wybranaGra}</h1>
              <h2>Twoje saldo: {mojeSaldo} PLN</h2>
              <p>Tutaj znajdzie się mechanika gry.</p>
              <button onClick={() => setWybranaGra(null)}>← Wróć do menu</button>
            </div>
          ) : ( //MENU GLOWNE JESLI NIE JEST WYBRANA GRA (WybranaGra(null))
            <div style={{ textAlign: "center" }}>
              <h1>Wybierz grę</h1>
              <h2>Twoje saldo: {mojeSaldo == null ? "BANKRUT" : mojeSaldo}</h2>
              <div className="grid">
                <div className="card" onClick={() => setWybranaGra('Ruletka')}>
                  <h3>Ruletka</h3>
                </div>
                <div className="card" onClick={() => setWybranaGra('Slots')}>
                  <h3>Slots</h3>
                </div>
                <div className="card" onClick={() => setWybranaGra('(?)')}>
                  <h3>?</h3>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
