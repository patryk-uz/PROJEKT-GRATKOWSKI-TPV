<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>React Menu Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  //LADNIEJSZY CSS POZNIEJ TERAZ TYLKO TAK STARTOWO
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Prawy górny róg - lista graczy w lobby */
    .lobby-widget {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .lobby-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 2px;
      font-weight: bold;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Okrągły awatar w stylu profilu */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .player-row.is-me .avatar {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .player-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .player-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .player-balance {
      font-size: 12px;
      color: #4ade80;
      font-family: monospace;
      font-weight: bold;
    }

    /* Karty gier */
    .grid { display: flex; gap: 16px; margin-top: 20px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 12px;
      width: 120px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .card:hover { 
      border-color: #38bdf8; 
      transform: translateY(-4px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      background: #38bdf8;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    // DEKLARACJE ZMIENNYCH 
    function App() {
      const [wybranaGra, setWybranaGra] = useState(null);
      const [mojeSaldo, setMojeSaldo] = useState(null);
      const [saldo2,saldo3,saldo4] = useState(null);

      // TU PRZYPISUJEMY SALDA GRACZY CHYBA ZE LEPIEJ JUZ W TABELI

      // DANE W LOBBY
      const graczeWLobby = [
        { id: 1, nick: "Ty", saldo: mojeSaldo, avatar: "👑", isMe: true },
        { id: 2, nick: "", saldo: saldo2, avatar: "🎩", isMe: false },
        { id: 3, nick: "", saldo: saldo3, avatar: "🕶️", isMe: false },
        { id: 4, nick: "", saldo: saldo4, avatar: "🎮", isMe: false },
      ];

      return (
        <div>
          <div className="lobby-widget">
            <span className="lobby-title">W lobby (4)</span>
            {graczeWLobby.map((gracz) => (
              <div key={gracz.id} className={`player-row ${gracz.isMe ? 'is-me' : ''}`}>
                <div className="avatar">{gracz.avatar}</div>
                <div className="player-info">
                  <span className="player-name">{gracz.nick}</span>
                  <span className="player-balance">
                   {gracz.saldo == null ? "BANKRUT" : gracz.saldo}
                  </span>
                </div>
              </div>
            ))}
          </div>

          //STRONA GRY
          {wybranaGra ? (
            <div style={{ textAlign: "center" }}>
              <h1>Grasz teraz w: {wybranaGra}</h1>
              <h2>Twoje saldo: {mojeSaldo} PLN</h2>
              <p>Tutaj znajdzie się mechanika gry.</p>
              <button onClick={() => setWybranaGra(null)}>← Wróć do menu</button>
            </div>
          ) : ( //MENU GLOWNE JESLI NIE JEST WYBRANA GRA (WybranaGra(null))
            <div style={{ textAlign: "center" }}>
              <h1>Wybierz grę</h1>
              <h2>Twoje saldo: {mojeSaldo == null ? "BANKRUT" : mojeSaldo}</h2>
              <div className="grid">
                <div className="card" onClick={() => setWybranaGra('Ruletka')}>
                  <h3>Ruletka</h3>
                </div>
                <div className="card" onClick={() => setWybranaGra('Slots')}>
                  <h3>Slots</h3>
                </div>
                <div className="card" onClick={() => setWybranaGra('(?)')}>
                  <h3>?</h3>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
