<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasyno Pro</title>
  <!-- Wyglad menu -->
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Prawy górny róg - lista graczy w lobby */
    .lobby-widget {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .lobby-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 2px;
      font-weight: bold;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Okrągły awatar w stylu profilu */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .player-row.is-me .avatar {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .player-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .player-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .player-balance {
      font-size: 12px;
      color: #4ade80;
      font-family: monospace;
      font-weight: bold;
    }

    /* Karty gier */
    .grid { flex-wrap: wrap; display: flex; gap: 16px; margin-top: 20px; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 12px;
      width: 120px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .card:hover { 
      border-color: #38bdf8; 
      transform: translateY(-4px);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      background: #38bdf8;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>


  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script src="/app.js"></script>
</body>
</html>
